<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGGNAROK - Audit Tool</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; color: #e5e5e5; min-height: 100vh; padding: 2rem;
    }
    .container { max-width: 72rem; margin: 0 auto; }
    .bg-brand { color: #f59e0b; }
    .bg-surface { background: #171717; }
    .bg-surface-strong { background: #262626; }
    .border-line { border-color: #404040; }
    .text-muted { color: #a3a3a3; }
    .text-foreground { color: #e5e5e5; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }
    .shadow-xl { box-shadow: 0 24px 48px -12px rgba(0,0,0,0.5); }
    .p-6 { padding: 1.5rem; }
    .p-4 { padding: 1rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mt-2 { margin-top: 0.5rem; }
    .flex { display: flex; }
    .grid { display: grid; }
    .gap-6 { gap: 1.5rem; }
    .gap-4 { gap: 1rem; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .items-start { align-items: flex-start; }
    .w-full { width: 100%; }
    .max-w-6xl { max-width: 48rem; }
    input, button { background: #171717; color: #e5e5e5; border: 1px solid #404040; border-radius: 0.5rem; font-family: inherit; }
    input { padding: 0.75rem; width: 100%; }
    button { cursor: pointer; padding: 0.75rem 1.5rem; border: none; }
    .btn-brand { background: #f59e0b; color: #0a0a0a; font-weight: 700; }
    .spinner { width: 20px; height: 20px; border: 2px solid #404040; border-top-color: #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar { height: 0.5rem; background: #262626; border-radius: 9999px; overflow: hidden; }
    .progress-fill { height: 100%; background: #f59e0b; transition: width 0.3s ease; }
    .card { border: 1px solid #404040; border-radius: 0.75rem; padding: 1rem; }
    .issue-card { background: #171717; }
    .suggestion-card { background: linear-gradient(to bottom, rgba(245,158,11,0.05), transparent); }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;
    
    function App() {
      const [url, setUrl] = useState("");
      const [status, setStatus] = useState("idle");
      const [stepIndex, setStepIndex] = useState(0);
      const [result, setResult] = useState(null);
      const [useAdminAuth, setUseAdminAuth] = useState(false);
      const [adminCredentials, setAdminCredentials] = useState({ username: "", password: "" });
      
      const steps = [
        "Estabelecendo conexão segura SSL...",
        "Autenticando na área administrativa...",
        "Baixando conteúdo HTML da página inicial...",
        "Executando varredura de bugs de código...",
        "Analisando Tags de SEO...",
        "Avaliando contraste de cores...",
        "Analisando responsividade...",
        "Verificando acessibilidade (WCAG)...",
        "Medindo performance...",
        "Identificando gargalos de conversão..."
      ];

      const startAnalysis = () => {
        if (!url) return;
        setStatus("loading");
        setStepIndex(0);
        let i = 0;
        const iv = setInterval(() => {
          i++;
          if (i < steps.length) setStepIndex(i);
          else { clearInterval(iv); finishAnalysis(); }
        }, 300);
      };

      const finishAnalysis = () => {
        const mockResult = {
          url: url,
          score: { seo: 85, ux: 82, perf: 78, cro: 75, code: 90, design: 88 },
          details: { title: `Site: ${url}`, description: "Descrição da página", h1: `Bem-vindo`, h2Count: 5, ssl: url.startsWith("https"), loadTime: "1.2s", responsive: true, cookies: true },
          issues: [
            { type: "warning", category: "seo", title: "Meta description curta", description: "Adicione mais detalhes." },
            { type: "error", category: "code", title: "Imagens sem ALT", description: "Algumas imagens não têm descrição alternativa." }
          ],
          suggestions: [
            { title: "Otimizar SEO", impact: "high", agent: "Hermes", text: "Melhore as tags meta." },
            { title: "Corrigir contraste", impact: "medium", agent: "Isis", text: "Ajuste cores para acessibilidade." }
          ],
          technical: { htmlValidation: { errors: 2, warnings: 5 }, cssIssues: { errors: 1, unused: 10 }, jsErrors: [], accessibility: { violations: 1, passes: 30 } }
        };
        setResult(mockResult);
        setStatus("done");
      };

      const resetAnalysis = () => { setStatus("idle"); setStepIndex(0); setResult(null); };

      return React.createElement('div', { className: 'container' },
        React.createElement('div', { className: 'mb-8' },
          React.createElement('div', { className: 'flex items-center gap-2' },
            React.createElement('span', { className: 'h-px w-6 bg-brand' }),
            React.createElement('p', { className: 'text-xs font-semibold uppercase tracking-wide text-brand' }, 'Estúdio · Audit')
          ),
          React.createElement('h1', { className: 'text-3xl font-extrabold mt-2' }, 'Análise Automática de Site'),
          React.createElement('p', { className: 'text-sm text-muted mt-2' }, 'Auditoria de bugs, SEO, design e sugestões.')
        ),

        status === "idle" && React.createElement('div', { className: 'grid gap-6 lg:grid-cols-3' },
          React.createElement('div', { className: 'lg:col-span-2' },
            React.createElement('section', { className: 'rounded-2xl border border-line bg-surface-strong p-6' },
              React.createElement('h2', { className: 'text-lg font-bold mb-4' }, 'Configurar Análise'),
              React.createElement('div', { className: 'space-y-4' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'block text-xs font-semibold mb-2' }, 'URL do site'),
                  React.createElement('input', { type: 'url', value: url, onChange: (e) => setUrl(e.target.value), placeholder: 'https://meusite.com', className: 'w-full' })
                ),
                React.createElement('div', { className: 'flex items-center gap-3' },
                  React.createElement('input', { type: 'checkbox', checked: useAdminAuth, onChange: (e) => setUseAdminAuth(e.target.checked) }),
                  React.createElement('label', { className: 'text-sm cursor-pointer' }, 'Usar autenticação administrativa')
                ),
                useAdminAuth && React.createElement('div', { className: 'space-y-3' },
                  React.createElement('input', { type: 'text', placeholder: 'Usuário', value: adminCredentials.username, onChange: (e) => setAdminCredentials({...adminCredentials, username: e.target.value}), className: 'w-full' }),
                  React.createElement('input', { type: 'password', placeholder: 'Senha', value: adminCredentials.password, onChange: (e) => setAdminCredentials({...adminCredentials, password: e.target.value}), className: 'w-full' })
                ),
                React.createElement('button', { onClick: startAnalysis, disabled: !url, className: 'btn-brand w-full mt-4' }, 'Iniciar Auditoria')
              )
            )
          ),
          React.createElement('div', null,
            React.createElement('section', { className: 'rounded-2xl border border-line bg-surface-strong p-6' },
              React.createElement('h3', { className: 'text-sm font-bold mb-4' }, 'Recursos'),
              React.createElement('ul', { className: 'space-y-2 text-sm' },
                React.createElement('li', null, '✓ Varredura de bugs HTML/CSS/JS'),
                React.createElement('li', null, '✓ Análise de acessibilidade WCAG'),
                React.createElement('li', null, '✓ Auditoria de design visual'),
                React.createElement('li', null, '✓ Acesso administrativo')
              )
            )
          )
        ),

        status === "loading" && React.createElement('div', { className: 'text-center py-12' },
          React.createElement('div', { className: 'spinner mx-auto mb-4' }),
          React.createElement('h2', { className: 'text-xl font-bold mb-2' }, 'Executando Auditoria...'),
          React.createElement('p', { className: 'text-muted mb-4' }, steps[stepIndex]),
          React.createElement('div', { className: 'progress-bar mb-2' },
            React.createElement('div', { className: 'progress-fill', style: { width: `${(stepIndex / (steps.length - 1)) * 100}%` } })
          ),
          React.createElement('p', { className: 'text-xs text-muted' }, `${Math.round((stepIndex / (steps.length - 1)) * 100)}%`)
        ),

        status === "done" && result && React.createElement('div', { className: 'space-y-6' },
          React.createElement('button', { onClick: resetAnalysis, className: 'text-sm font-bold' }, '← Nova análise'),
          React.createElement('section', { className: 'rounded-2xl border border-line bg-surface-strong p-6' },
            React.createElement('div', { className: 'flex justify-between items-center mb-4' },
              React.createElement('div', null,
                React.createElement('span', { className: 'text-xs text-brand uppercase' }, 'Domínio Auditado'),
                React.createElement('h2', { className: 'text-xl font-bold' }, result.url)
              ),
              React.createElement('span', { className: 'px-3 py-1 rounded bg-emerald-500/10 text-emerald-400 text-xs' }, 'Concluído')
            ),
            React.createElement('div', { className: 'grid grid-cols-2 md:grid-cols-6 gap-4' },
              Object.entries(result.score).map(([label, value]) =>
                React.createElement('div', { key: label, className: 'card text-center' },
                  React.createElement('p', { className: 'text-xs text-muted uppercase' }, label),
                  React.createElement('p', { className: 'text-2xl font-bold' }, value, React.createElement('span', { className: 'text-xs text-muted' }, '/100'))
                )
              )
            )
          ),
          React.createElement('div', { className: 'grid md:grid-cols-2 gap-6' },
            React.createElement('section', { className: 'rounded-2xl border border-line bg-surface-strong p-6' },
              React.createElement('h3', { className: 'text-sm font-bold mb-4' }, 'Bugs & Alertas'),
              React.createElement('div', { className: 'space-y-3' },
                result.issues.map((issue, i) =>
                  React.createElement('div', { key: i, className: 'card issue-card' },
                    React.createElement('p', { className: 'font-bold mb-1' }, issue.title),
                    React.createElement('p', { className: 'text-sm text-muted' }, issue.description)
                  )
                )
              )
            ),
            React.createElement('section', { className: 'rounded-2xl border border-line bg-surface-strong p-6' },
              React.createElement('h3', { className: 'text-sm font-bold mb-4' }, 'Sugestões IA'),
              React.createElement('div', { className: 'space-y-3' },
                result.suggestions.map((s, i) =>
                  React.createElement('div', { key: i, className: 'card suggestion-card' },
                    React.createElement('div', { className: 'flex justify-between mb-1' },
                      React.createElement('span', { className: 'font-bold text-brand' }, s.agent),
                      React.createElement('span', { className: 'text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400' }, s.impact === 'high' ? 'Alto' : 'Médio')
                    ),
                    React.createElement('p', { className: 'font-bold mb-1' }, s.title),
                    React.createElement('p', { className: 'text-sm text-muted' }, s.text)
                  )
                )
              )
            )
          )
        )
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
