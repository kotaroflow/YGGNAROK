<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transições Suaves – Demo</title>
  <link rel="stylesheet" href="./transition.css" />
  <style>
    body {font-family: system-ui, sans-serif; background:#f9fafb; color:#111; margin:0; padding:2rem; display:flex; flex-direction:column; gap:2rem;}
    .demo-box {background:#fff; border:1px solid #ddd; padding:1.5rem; border-radius:8px; max-width:400px;}
    .placeholder {background:#e0e0e0; height:150px; display:flex; align-items:center; justify-content:center; color:#555; font-size:0.9rem;}
    button {margin-top:1rem; padding:0.5rem 1rem; border:none; background:#4f46e5; color:#fff; border-radius:4px; cursor:pointer;}
  </style>
</head>
<body>
  <h1>Demo de Transições Suaves</h1>

  <!-- Fade demo -->
  <div class="demo-box">
    <h2>Fade In / Out</h2>
    <div id="fadeTarget" class="transition-container fade-enter-active">
      <div class="placeholder">Conteúdo de exemplo</div>
    </div>
    <button onclick="toggleFade()">Alternar Fade</button>
  </div>

  <!-- Slide up demo -->
  <div class="demo-box">
    <h2>Slide Up</h2>
    <div id="slideTarget" class="transition-container slide-up-enter-active">
      <div class="placeholder">Outro conteúdo</div>
    </div>
    <button onclick="toggleSlide()">Alternar Slide</button>
  </div>

  <!-- Scale demo -->
  <div class="demo-box">
    <h2>Scale In</h2>
    <div id="scaleTarget" class="transition-container scale-enter-active">
      <div class="placeholder">Mais um exemplo</div>
    </div>
    <button onclick="toggleScale()">Alternar Scale</button>
  </div>

  <script>
    // Helper to force reflow for CSS transition restart
    function restart(el) {void el.offsetWidth;}
    function toggleFade(){
      const el=document.getElementById('fadeTarget');
      if(el.classList.contains('fade-enter-active')){
        el.classList.remove('fade-enter-active');
        el.classList.add('fade-exit-active');
        setTimeout(()=>{el.classList.remove('fade-exit-active'); el.classList.add('fade-enter'); restart(el); el.classList.add('fade-enter-active');},300);
      } else {
        el.classList.remove('fade-enter');
        el.classList.add('fade-enter-active');
      }
    }
    function toggleSlide(){
      const el=document.getElementById('slideTarget');
      if(el.classList.contains('slide-up-enter-active')){
        el.classList.remove('slide-up-enter-active');
        el.style.opacity='0';
        setTimeout(()=>{el.style.opacity=''; el.classList.add('slide-up-enter-active');},400);
      } else {
        el.classList.add('slide-up-enter-active');
      }
    }
    function toggleScale(){
      const el=document.getElementById('scaleTarget');
      if(el.classList.contains('scale-enter-active')){
        el.classList.remove('scale-enter-active');
        el.classList.add('scale-enter');
        restart(el);
        el.classList.add('scale-enter-active');
        setTimeout(()=>{el.classList.remove('scale-enter-active');},250);
      } else {
        el.classList.remove('scale-enter');
        el.classList.add('scale-enter-active');
      }
    }
  </script>
</body>
</html>
